name: Build Kom-BYDMate APK

on:
  # Release tags only: every release is a tag, and a second build of the same commit on main
  # just spent Actions minutes. workflow_dispatch keeps a manual build from the Actions tab.
  push:
    tags: ['v*-kom.*']
  workflow_dispatch:

# a tag (e.g. v3.19.3-kom.7) also publishes a GitHub release with the APK and the license notice
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # keystore.properties-ը (gitignored) ստեղծում ենք GitHub Secrets-ից․ առանց դրա APK-ն չի ստորագրվի
      - name: Signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 secret is missing"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kombydmate.p12"
          {
            echo "storeFile=$RUNNER_TEMP/kombydmate.p12"
            echo "storePassword=$SIGNING_PASSWORD"
            echo "keyAlias=kombydmate"
            echo "keyPassword=$SIGNING_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: Kom-BYDMate-apk
          path: app/build/outputs/apk/release/*.apk

      # Release notes: the tag's section of CHANGELOG-KOM.md ("## <version>" up to the next "## ").
      - name: Release notes (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG-KOM.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Kom-BYDMate $VERSION" > release-notes.md
          fi
          {
            echo
            echo "---"
            echo "Full history: [CHANGELOG-KOM.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG-KOM.md)"
          } >> release-notes.md

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: release-notes.md
          body_path: .github/RELEASE_NOTICE.md

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
