name: Build Kom-BYDMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # keystore.properties-ը (gitignored) ստեղծում ենք GitHub Secrets-ից․ առանց դրա APK-ն չի ստորագրվի
      - name: Signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 secret is missing"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kombydmate.p12"
          {
            echo "storeFile=$RUNNER_TEMP/kombydmate.p12"
            echo "storePassword=$SIGNING_PASSWORD"
            echo "keyAlias=kombydmate"
            echo "keyPassword=$SIGNING_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: Kom-BYDMate-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
